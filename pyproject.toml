[project]
name = "taka"
version = "0.1.0"
description = "A fast YouTube audio downloader."
readme = "README.md"
authors = [
    { name = "fairygaze", email = "fairygaze@proton.me" }
]
requires-python = ">=3.13"
dependencies = [
    "segja",
    "yt-dlp>=2026.7.4",
]

[project.scripts]
taka = "taka:main"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 160

[tool.uv.sources]
segja = { git = "ssh://git@github.com/fairygaze/segja" }

[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "ruff>=0.16.0",
]
